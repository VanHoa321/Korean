<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ cấp 1 - Học Tiếng Hàn</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-solid-rounded/css/uicons-solid-rounded.css'>
    
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4 sticky-top shadow-sm">
        <div class="container">
            <button class="btn border-0 me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
                <i class="fi fi-rr-menu-burger" style="font-size: 1.2rem;"></i>
            </button>
            <span class="navbar-brand mb-0 h1 fw-bold">
                <i class="fi fi-rr-graduation-cap me-2"></i> ĐM TIẾNG HÀN
            </span>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold" id="sidebarMenuLabel"><i class="fi fi-rr-user me-2"></i>Võ Văn Hòa</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="list-group list-group-flush">
                <a href="#" class="list-group-item list-group-item-action" onclick="location.reload()">
                    <i class="fi fi-rr-home me-2 text-danger"></i> Trang chủ
                </a>
                <a href="#" class="list-group-item list-group-item-action" onclick="alert('Học viên: Võ Văn Hòa')">
                    <i class="fi fi-rr-info me-2 text-info"></i> Thông tin học viên
                </a>
                <a href="#" class="list-group-item list-group-item-action" onclick="alert('Chức năng đang cập nhật')">
                    <i class="fi fi-rr-document-signed me-2 text-success"></i> Làm bài kiểm tra
                </a>
            </div>
        </div>
    </div>

    <div class="container main-container bg-white rounded shadow-sm p-4 mb-5">
        
        <div class="search-container">
            <div class="input-group">
                <span class="input-group-text bg-white text-muted border-end-0">
                    <i class="fi fi-rr-search" style="font-size: 14px;"></i>
                </span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Tìm kiếm từ vựng, ngữ pháp..." onkeyup="filterCards()">
            </div>
        </div>

        <div class="filter-section category-group mb-3 border-bottom pb-3">
            
            <div class="d-flex flex-wrap gap-2 align-items-center mb-3 pb-3 border-bottom border-light-subtle">
                <span class="fw-bold text-theme small me-2"><i class="fi fi-rr-apps me-1"></i>MỤC HỌC</span>
                <button class="btn btn-theme-outline btn-sm rounded-pill filter-btn d-inline-flex align-items-center" onclick="setCategory('All', this)">
                    Tất cả
                </button>
                <button class="btn btn-theme-outline btn-sm rounded-pill d-inline-flex align-items-center" onclick="shuffleCards()">
                    <i class="fi fi-rr-shuffle me-1"></i> Xáo trộn
                </button>
                <button class="btn btn-theme btn-sm rounded-pill filter-btn d-inline-flex align-items-center" onclick="setCategory('new', this)">
                    <i class="fi fi-rr-sparkles me-1"></i> Từ mới
                </button>
                <button class="btn btn-theme-outline btn-sm rounded-pill d-inline-flex align-items-center" onclick="setCategory('starred', this)">
                    <i class="fi fi-rr-star me-1"></i> Từ khó
                </button>
                <button class="btn btn-theme-outline btn-sm rounded-pill filter-btn d-inline-flex align-items-center" onclick="setCategory('grammar', this)">
                    <i class="fi fi-rr-book-alt me-1"></i> Ngữ pháp
                </button>
            </div>

            <div class="d-flex flex-wrap gap-2 align-items-center mt-1">
                <span class="fw-bold text-theme small me-2"><i class="fi fi-rr-bulb me-1"></i>KỸ NĂNG</span>
                <button class="btn btn-theme btn-sm rounded-pill d-inline-flex align-items-center" id="flashcard-btn" onclick="toggleFlashcardMode(this)">
                    <i class="fi fi-rr-refresh me-1"></i> Học Flashcard
                </button>
                <button class="btn btn-theme-outline btn-sm rounded-pill filter-btn d-inline-flex align-items-center" onclick="setCategory('translate', this)">
                    <i class="fi fi-rr-edit me-1"></i> Luyện dịch
                </button>
            </div>

            <div id="flashcard-controls" class="mt-3 text-start" style="display: none;">
                <div class="form-check form-switch mb-0 ps-0 d-flex align-items-center">
                    <input class="form-check-input ms-0 mt-0 fs-5" type="checkbox" id="langToggle" onchange="toggleLangDirection()" style="cursor: pointer;">
                    <label class="form-check-label small fw-bold text-theme ms-2" for="langToggle" style="cursor: pointer; user-select: none;">
                        Mặt trên là Tiếng Hàn <i class="fi fi-rr-exchange ms-1"></i>
                    </label>
                </div>
            </div>
        </div>

        <div class="filter-section mb-3">
            <div class="d-flex flex-wrap gap-2 align-items-center pb-3 border-bottom border-light-subtle" id="level-buttons">
                <span class="fw-bold text-theme small me-2"><i class="fi fi-rr-layers me-1"></i>CẤP HỌC</span>
                <button class="btn btn-theme btn-sm rounded-pill filter-btn active" onclick="setLevel('TOPIK 1', this)">Sơ cấp 1</button>
                <button class="btn btn-theme-outline btn-sm rounded-pill filter-btn" onclick="setLevel('TOPIK 2', this)">Sơ cấp 2</button>
                <button class="btn btn-theme-outline btn-sm rounded-pill filter-btn" onclick="setLevel('TOPIK 3', this)">Trung cấp 3</button>
                <button class="btn btn-theme-outline btn-sm rounded-pill filter-btn" onclick="setLevel('TOPIK 4', this)">Trung cấp 4</button>
                <button class="btn btn-theme-outline btn-sm rounded-pill filter-btn" onclick="setLevel('TOPIK 5', this)">Cao cấp 5</button>
                <button class="btn btn-theme-outline btn-sm rounded-pill filter-btn" onclick="setLevel('TOPIK 6', this)">Cao cấp 6</button>
            </div>
        </div>

        <div class="filter-section mb-4">
            <div class="d-flex flex-wrap gap-2 align-items-center" id="lesson-buttons">
                <span class="fw-bold text-theme small me-2"><i class="fi fi-rr-bookmark me-1"></i>CHỌN BÀI</span>
                <button class="btn btn-theme btn-sm rounded-pill filter-btn active" onclick="setLesson('All', this)">Tất cả</button>
            </div>
        </div>

        <div id="card-container" class="row g-3">
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="data.js"></script>
</body>
</html>
